const norm=s=>s.normalize("NFKC").replace(/[\s\p{P}\p{S}]/gu,"").toLowerCase();
const match=(a,t)=>{a=norm(a);return a!==""&&(a===norm(t)||t.split("/").some(p=>norm(p)===a))};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let mode,N,Q,i,score,combo,ok,wrong,spent=0,qs=0,answered,sound=true,name="兩津勘吉",ac,lbKey="forward-10";

function beep(t){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();
const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.connect(g);g.connect(ac.destination);
const P={ok:["triangle",[[523,0],[880,.12]],.25],bad:["sawtooth",[[220,0],[130,.1]],.3],win:["sine",[[440,0],[554,.1],[659,.2],[880,.3]],.5]}[t];
o.type=P[0];P[1].forEach(([f,d])=>o.frequency.setValueAtTime(f,n+d));g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.01,n+P[2]);o.start(n);o.stop(n+P[2])}catch(x){}}
$("snd").onclick=()=>{sound=!sound;$("snd").textContent=sound?"🔊 音效：開啟":"🔇 音效：關閉"};

/* PR：先由答對率決定區間，再用平均秒數決定區間內的位置；連擊分數不再影響 PR */
function calcPR(score,acc,sec,n,m){
  if(n===0||acc===0)return 1;
  const r=m==="reverse",par=r?20:8,avg=sec/n;
  /* [答對率下限, 答對率上限, PR 下限, PR 上限] */
  const B=acc<=10?[0,10,1,29]:acc<=70?[10,70,30,80]:acc<96?[70,96,81,95]:[96,100,96,99];
  const pa=(acc-B[0])/(B[1]-B[0]);
  /* 一般秒數係數：平均在基準內不扣分，越慢越低 */
  const t=avg<=par?1:Math.max(0,1-(avg-par)/(par*3));
  let pr=Math.round(B[2]+(B[3]-B[2])*(.7*pa+.3*t));
  if(pr>=95){
    /* 95 以上：平均用時從基準秒數(上限 94)線性縮短到 99 分門檻(數字 1.8 秒、標題 5.4 秒) */
    const fast=r?5.4:1.8,f=Math.max(0,Math.min(1,(par-avg)/(par-fast)));
    pr=Math.min(pr,94+Math.floor(5*f));
  }
  return Math.max(1,Math.min(99,pr));
}

/* 排行榜：依模式＋題數分開，PR → 分數 → 時間 */
try{["kochikame_lb_v2","kochikame_leaderboard"].forEach(k=>localStorage.removeItem(k))}catch(e){}
const LK="kochikame_lb_v3",CFG=[["forward",10],["forward",25],["forward",50],["reverse",10],["reverse",25]];
const lbLoad=()=>{try{return JSON.parse(localStorage.getItem(LK))||{}}catch(e){return{}}};
function lbSave(key,en){try{const d=lbLoad();d[key]=(d[key]||[]).concat(en).sort((a,b)=>b.pr-a.pr||b.score-a.score||a.time-b.time).slice(0,5);localStorage.setItem(LK,JSON.stringify(d))}catch(e){}}
function renderLB(){
  const tabs=$("tabs");tabs.textContent="";
  CFG.forEach(([m,n])=>{const k=m+"-"+n,b=document.createElement("button");b.type="button";b.className="btn sm "+(k===lbKey?"sel":"alt");b.textContent=(m==="forward"?"📖 ":"✍️ ")+n+" 題";b.onclick=()=>{lbKey=k;renderLB()};tabs.appendChild(b)});
  const box=$("lb"),l=lbLoad()[lbKey]||[];box.textContent="";
  if(!l.length){const p=document.createElement("p");p.className="mute";p.textContent="還沒有紀錄，完成一局就會上榜。";box.appendChild(p);return}
  l.forEach((e,k)=>{const d=document.createElement("div");d.className="lbrow";
    const a=document.createElement("span");a.textContent="#"+(k+1)+" "+e.name;
    const b=document.createElement("span");b.textContent="PR "+e.pr+"．"+e.score+" 分．"+e.time+" 秒";
    d.append(a,b);box.appendChild(d)});
}

/* 大名不可重複：已建立的大名只能從清單點選，不能重新輸入建立 */
const NK="kochikame_names",MK="kochikame_me";
const nkey=s=>s.normalize("NFKC").replace(/\s+/g,"").toLowerCase();
const nList=()=>{try{return JSON.parse(localStorage.getItem(NK))||[]}catch(e){return[]}};
const meGet=()=>{try{return localStorage.getItem(MK)||""}catch(e){return""}};
const nSave=(l,me)=>{try{localStorage.setItem(NK,JSON.stringify(l));localStorage.setItem(MK,me)}catch(e){}};
function renderNames(){
  const box=$("names"),l=nList(),me=nkey(meGet());box.textContent="";
  if(!l.length)return;
  const p=document.createElement("span");p.className="mute";p.style.margin="0";p.textContent="已建立的大名：";box.appendChild(p);
  l.forEach(n=>{const b=document.createElement("button");b.type="button";b.className="btn sm "+(nkey(n)===me?"sel":"alt");b.textContent=n;
    b.onclick=()=>{nSave(l,n);$("nm").value=n;tg("nmerr",false);renderNames()};box.appendChild(b)});
}
function claim(){
  const v=$("nm").value.trim().replace(/\s+/g," "),e=$("nmerr");
  const fail=m=>{e.textContent=m;tg("nmerr",true);$("nm").focus();return false};
  if(!v)return fail("請先輸入大名，或點選下方已建立的大名。");
  const l=nList(),k=nkey(v),ex=l.find(n=>nkey(n)===k);
  if(ex&&nkey(meGet())!==k)return fail("這個大名已經有人用了，請換一個，或點選下方已建立的大名。");
  if(!ex)l.push(v);
  nSave(l,ex||v);name=ex||v;tg("nmerr",false);renderNames();return true;
}
/* 數字模式：只能輸入 1～341 */
function clampNum(e){
  if(mode!=="forward"||(e&&e.isComposing))return;
  const x=$("inp");let v=x.value.normalize("NFKC").replace(/\D/g,"").replace(/^0+/,"");
  if(v&&+v>341)v=v.slice(0,-1);
  x.value=v;
}
$("inp").addEventListener("input",clampNum);$("inp").addEventListener("compositionend",clampNum);
$("nm").addEventListener("input",()=>tg("nmerr",false));

function show(id){["menu","game","result"].forEach(s=>tg(s,s===id))}
function start(m,n){
  if(!claim())return;
  mode=m;N=n;Q=shuffle(EP).slice(0,n);i=0;score=combo=ok=0;wrong=[];spent=0;lbKey=m+"-"+n;
  $("score").textContent=0;tg("combo",false);
  $("inp").type="text";$("inp").inputMode=m==="forward"?"numeric":"text";$("inp").maxLength=m==="forward"?3:100;
  $("qt").textContent=n;show("game");load();
}
function load(){
  const q=Q[i];answered=false;qs=Date.now();
  $("qn").textContent=i+1;$("bar").style.width=(i/N*100)+"%";tg("fb",false);
  const f=mode==="forward";
  $("hint").textContent=f?"這是第幾集？（1～341）":"請輸入這一集的完整標題";
  $("prompt").textContent=f?"「"+q.title+"」":"第 "+q.id+" 集";
  const x=$("inp");x.value="";x.disabled=false;setTimeout(()=>x.focus(),50);
  tg("go",true);tg("skip",true);tg("next",false);
}
function fb(kind,msg){const b=$("fb");b.className=kind;b.textContent=msg}
function judge(good,given){
  const q=Q[i],f=mode==="forward",idx=i,correct=f?"第 "+q.id+" 集":q.title;
  answered=true;spent+=Date.now()-qs;$("inp").disabled=true;tg("go",false);tg("skip",false);
  if(good){
    beep("ok");combo++;ok++;
    const p=(f?100:150)+(combo-1)*(f?20:30);score+=p;$("score").textContent=score;
    tg("combo",combo>1);$("cc").textContent=combo;
    fb("ok","🎉 答對了！+"+p+" 分");
    setTimeout(()=>{if(i===idx&&answered)next()},1000);
    return;
  }
  beep("bad");combo=0;tg("combo",false);
  wrong.push({q:f?q.title:"第 "+q.id+" 集",a:correct,g:given});
  if(given==="放棄作答"){fb("warn","🏳️ 放棄！正確答案：「"+correct+"」")}
  else{fb("bad","❌ 答錯了！正確答案：「"+correct+"」");const c=$("card");c.classList.add("shake");setTimeout(()=>c.classList.remove("shake"),400)}
  tg("next",true);$("next").focus();
}
$("form").onsubmit=e=>{
  e.preventDefault();if(answered)return next();
  const q=Q[i],raw=$("inp").value;
  if(mode==="forward"){const v=parseInt(raw,10);if(isNaN(v))return;judge(v===q.id,"第 "+v+" 集")}
  else{if(!raw.trim())return;judge(match(raw,q.title),raw)}
};
$("skip").onclick=()=>judge(false,"放棄作答");
$("next").onclick=()=>next();
function next(){i++;i>=N?end():load()}

function end(){
  beep("win");
  const secF=spent/1000,sec=Math.round(secF),acc=Math.round(ok/N*100),pr=calcPR(score,acc,secF,N,mode);
  let r=["寺井洋一級","平淡也是一種幸福！多看幾集動畫再來挑戰吧！"];
  if(acc===100)r=["神級．龜有傳奇大師","全數答對，大原所長也要甘拜下風！"];
  else if(acc>=80)r=["中川＆麗子精英級","對烏龍派出所瞭如指掌，是署裡不可或缺的人才！"];
  else if(acc>=50)r=["本田速人級","表現中規中矩，只要不騎上機車一切都安穩！"];
  else if(acc>=30)r=["兩津勘吉級","靠直覺與強韌的生命力硬撐過來了！"];
  $("rank").textContent=r[0];$("rdesc").textContent=r[1];
  $("fs").textContent=score;$("fa").textContent=acc+"%";$("fc").textContent=ok+"/"+N;$("ft").textContent=sec+" 秒";$("fp").textContent="PR "+pr;
  $("wc").textContent="（共錯 "+wrong.length+" 題）";
  const wl=$("wl");wl.textContent="";
  if(!wrong.length){const p=document.createElement("p");p.textContent="沒有錯題，完美通關！✨";wl.appendChild(p)}
  wrong.forEach(w=>{const d=document.createElement("div");d.className="wr";
    const a=document.createElement("b");a.textContent=w.q;
    const b=document.createElement("div");b.className="mute";b.style.margin="2px 0 0";b.textContent="正確：「"+w.a+"」　你的回答："+w.g;
    d.append(a,b);wl.appendChild(d)});
  lbSave(mode+"-"+N,{name,score,pr,time:sec,acc,secF});
  show("result");
}
$("again").onclick=()=>start(mode,N);
$("home").onclick=()=>{renderLB();show("menu")};
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>start(b.dataset.m,+b.dataset.n));
$("nm").value=meGet();renderNames();
renderLB();
</script>
